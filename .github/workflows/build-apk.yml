# Builds Saz's Diary as an Android app and publishes the APK as a release.
# Runs when anything in app/ changes, or by hand from the Actions tab.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Create Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KS_PATH: ${{ runner.temp }}/saz-diary.jks
        run: |
          npx cap add android
          node prepare.mjs
          npx cap sync android

      - name: Unpack signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The KS_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/saz-diary.jks"

      - name: Build signed APK
        working-directory: app/android
        env:
          KS_PATH: ${{ runner.temp }}/saz-diary.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/saz-diary.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: saz-diary-apk
          path: saz-diary.apk

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.${{ github.run_number }}" saz-diary.apk \
            --title "Saz's Diary 1.${{ github.run_number }}" \
            --notes "Android app. Open this page on your phone and tap saz-diary.apk to install. Your diary pages are never in this file."
